<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>دخول | Almizaj ERP</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Tajawal', sans-serif; direction:rtl; color:white; }
        body { background: #0f172a; display:flex; justify-content:center; align-items:center; height:100vh; }
        .card { background: rgba(30,41,59,0.6); padding:40px; border-radius:24px; border:1px solid rgba(255,255,255,0.08); text-align:center; width:400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input { width:100%; padding:15px; background:rgba(0,0,0,0.3); border:1px solid #334155; border-radius:12px; margin-bottom:20px; text-align:center; font-size:24px; letter-spacing:10px; outline:none; transition:0.3s; }
        input:focus { border-color:#8b5cf6; }
        .btn { width:100%; padding:15px; background:#8b5cf6; border:none; border-radius:12px; font-weight:bold; font-size:18px; cursor:pointer; transition:0.3s; }
        .btn:hover { opacity:0.8; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="color:#8b5cf6; font-size:28px; margin-bottom:10px;">Almizaj ERP 👑</h2>
        <p style="color:#94a3b8; margin-bottom:20px;">الوصول مسموح للمصرح لهم فقط</p>
        {% if error %} <p style="color:#ef4444; margin-bottom:15px; font-weight:bold;">{{ error }}</p> {% endif %}
        <form method="POST">
            <input type="password" name="password" placeholder="••••••" required autofocus>
            <button class="btn">تسجيل الدخول</button>
        </form>
    </div>
</body>
</html>
